<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LP 数字化看板 · 登录</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#2d3644;--text:#e6edf3;--dim:#8b949e;--blue:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:340px}
.box h1{font-size:18px;margin-bottom:4px;color:var(--blue)}
.box p{color:var(--dim);font-size:12px;margin-bottom:20px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:9px 10px;font-size:14px}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:20px;background:#1f6feb;border:1px solid #1f6feb;color:#fff;
  border-radius:6px;padding:9px;font-size:14px;cursor:pointer}
button:hover{background:#388bfd}
.err{color:#f85149;font-size:12px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <h1>LP 数字化看板</h1>
  <p>云端决策台 · 凭账号进入</p>
  <label>账号</label>
  <input id="u" autocomplete="username" autofocus>
  <label>密码</label>
  <input id="p" type="password" autocomplete="current-password">
  <button onclick="doLogin()">进入看板</button>
  <div class="err" id="err"></div>
</div>
<script>
"use strict";
async function doLogin() {
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: document.getElementById("u").value.trim(),
                            password: document.getElementById("p").value})
    });
    const data = await res.json();
    if (!data.ok) { err.textContent = data.error || "登录失败"; return; }
    location.href = "/app/";
  } catch (e) {
    err.textContent = "网络异常，稍后再试";
  }
}
document.getElementById("p").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
