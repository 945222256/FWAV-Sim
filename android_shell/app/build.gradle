// android_shell/app/build.gradle — 薄壳应用模块（I-064）
//
// 判据三的执行体：本模块不含任何网络请求代码，数据展示完全由
// Trusted Web Activity 加载的云端看板前端完成。静态检索脚本为
// tools/verify_i064.py 的只读判据。
plugins {
    id "com.android.application"
}

android {
    namespace "com.lp.board"
    compileSdk 35

    defaultConfig {
        applicationId "com.lp.board"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes.release {
        minifyEnabled false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
    // kotlin-stdlib 1.8 起并入 jdk7/jdk8 变体，强制对齐到 appcompat 链的 1.8.22，
    // 消除 browser 2.5.0 传递链上 1.6.21 旧变体的重复类冲突。
    configurations.all {
        resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}
